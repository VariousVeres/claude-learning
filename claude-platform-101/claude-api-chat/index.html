<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Haiku Chat</title>
  <style>
    :root {
      --bg: #f4f4f7;
      --card: #ffffff;
      --text: #1d1d22;
      --muted: #7a7a85;
      --border: #e3e3ea;
      --accent: #d97757;
      --accent-hover: #c4633f;
      --answer-bg: #faf7f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171b;
        --card: #222228;
        --text: #ececf1;
        --muted: #9a9aa6;
        --border: #34343c;
        --answer-bg: #1c1c21;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .chat {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .model { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 0 20px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: wait; }
    .counter { margin: 6px 16px 18px; font-size: 12px; color: var(--muted); text-align: right; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    textarea {
      width: 100%;
      height: 120px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--answer-bg);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
    }
    .error { color: #d64545; }
  </style>
</head>
<body>
  <main class="chat">
    <h1>Чат з Claude</h1>
    <p class="model">Модель: {{MODEL}}</p>

    <form id="form">
      <input id="message" maxlength="{{MAX_INPUT_CHARS}}" placeholder="Напиши питання…" autocomplete="off" autofocus>
      <button id="send" type="submit">Надіслати</button>
    </form>
    <div class="counter"><span id="count">0</span>/{{MAX_INPUT_CHARS}}</div>

    <label for="answer">Відповідь</label>
    <textarea id="answer" maxlength="{{MAX_ANSWER_CHARS}}" readonly placeholder="Тут з'явиться відповідь Claude…"></textarea>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const button = document.getElementById("send");
    const answer = document.getElementById("answer");
    const count = document.getElementById("count");

    input.addEventListener("input", () => { count.textContent = input.value.length; });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      button.disabled = true;
      answer.classList.remove("error");
      answer.value = "Claude думає…";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Невідома помилка");
        answer.value = data.answer;
        input.value = "";
        count.textContent = 0;
      } catch (err) {
        answer.classList.add("error");
        answer.value = err.message;
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
